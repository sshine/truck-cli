[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sshine/truck-cli"
# Uncomment when the workspace publishes a library. It is the floor Cargo resolves
# dependencies against, and the value a per-crate linting flavour has to pass on.
# rust-version = "1.85"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dev dependencies
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
